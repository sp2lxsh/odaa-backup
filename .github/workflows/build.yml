name: build-windows-exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: PyInstaller (папка с программой)
        run: |
          pyinstaller --noconfirm odaa-backup.spec
          copy README.md "dist\ODAA Backup\"
          copy config.example.yaml "dist\ODAA Backup\"
      - name: Smoke test
        shell: pwsh
        run: |
          cd "dist\ODAA Backup"
          .\odaa-backup.exe --help
          .\odaa-backup.exe check
          if (Test-Path data) { Remove-Item -Recurse -Force data }
          if (-not (Test-Path "_internal\odaa_backup\static\inter-tight-cyrillic-wght-normal.woff2")) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: odaa-backup-windows
          path: dist/
      - name: Release (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\ODAA Backup" -DestinationPath odaa-backup-windows.zip
          gh release create $env:GITHUB_REF_NAME odaa-backup-windows.zip --title $env:GITHUB_REF_NAME --notes "Сборка для Windows 11"
        env:
          GH_TOKEN: ${{ github.token }}
